plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = mod_version
group = mod_group_id
// Artifact file name is derived from the display name (spaces/symbols -> dashes),
// so the jar reads e.g. "moonshiner-0.0.1-beta.jar" while the mod metadata
// keeps mod_version with its space ("0.0.1 beta").
def modArchiveName = mod_name.toLowerCase().replaceAll('[^a-z0-9]+', '-').replaceAll(/^-|-$/, '')
base { archivesName = modArchiveName }
tasks.named('jar') { archiveVersion = mod_version.replace(' ', '-') }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    // Official field/method names straight from Mojang's mapping files.
    mappings channel: mapping_channel, version: mapping_version

    // Official mappings are used at runtime, so ForgeGradle does not need to
    // reobfuscate the jar.
    reobf = false

    // Run processResources before launching the game from the IDE.
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
        }
        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }
    }
}

repositories {
    // Put repositories for dependencies here.
    // ForgeGradle automatically adds the Forge maven and Maven Central for you.
    // Keeping a (possibly empty) block matches the official MDK.
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(ProcessResources).configureEach { filteringCharset = 'UTF-8' }

// Advancement JSON is produced by `runData`; the folder is committed so a
// plain `build` works without running the generators first.
sourceSets.main.resources {
    srcDir 'src/generated/resources'
    // Data generators keep a hash cache next to their output; it is not mod
    // data and must never end up at the root of the released jar.
    exclude '.cache/**'
}

// Expand the mod metadata placeholders with the values from gradle.properties.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors,
        ])
    }
}

// Merge each source set's resources into the same directory as its classes.
// ForgeGradle expects this so the dev-time module scan sees "mods.toml" and the
// mod's classes side by side (the MDK ships the same block).
sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

tasks.register('verifySimulation', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ru.samogon.process.SimulationTest'
}
tasks.register('verifyChains', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ru.samogon.process.ProductionChainTest'
}
tasks.register('verifyTypes', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ru.samogon.process.SpiritTypeTest'
}
tasks.register('verifyAromas', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ru.samogon.process.AromaTest'
}
tasks.register('verifyAssets', Exec) {
    workingDir projectDir
    commandLine javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }.get().executablePath.asFile,
            'tools/VerifyAssets.java'
}
tasks.named('check') { dependsOn 'verifySimulation', 'verifyChains', 'verifyTypes', 'verifyAromas', 'verifyAssets' }
